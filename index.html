<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 Mis Tareas U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="floaters" id="floaters"></div>

<div class="wrap">
  <header>
    <h1 class="brand">🎀 Mis Tareas U</h1>
    <p class="subtitle">Aula Virtual, Teams o clase — todo en un solo lugar</p>
    <div class="tabs">
      <button class="tab active" data-view="tareas">📋 Tareas</button>
      <button class="tab" data-view="calendario">🗓️ Calendario</button>
    </div>
  </header>

  <section class="view active" id="view-tareas">
    <h2 class="section-title">Pendientes <span class="count-pill" id="count-pend">0</span></h2>
    <div id="list-pendientes"></div>

    <h2 class="section-title">Completadas <span class="count-pill" id="count-done">0</span></h2>
    <div id="list-completadas"></div>
  </section>

  <section class="view" id="view-calendario">
    <div class="cal-head">
      <button id="cal-prev">◀</button>
      <span class="month-label" id="cal-label"></span>
      <button id="cal-next">▶</button>
    </div>
    <div class="cal-grid" id="cal-dow"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:6px;"></div>
    <div class="cal-selected" id="cal-selected"></div>
  </section>
</div>

<button class="fab" id="fab-add">+</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">Nueva tarea</h3>
    <form id="task-form">
      <input type="hidden" id="task-id">
      <div class="field">
        <label>Nombre de la clase</label>
        <input type="text" id="f-titulo" required placeholder="Ej: Taller de expresiones regulares">
      </div>
      <div class="field">
        <label>Dónde entregar</label>
        <select id="f-plataforma">
          <option value="aula">Aula Virtual</option>
          <option value="teams">Teams</option>
          <option value="examen">En clase </option>
          
        </select>
      </div>
      <div class="field">
        <label>Fecha límite</label>
        <input type="date" id="f-fecha" required>
      </div>
      <div class="field">
        <label>Descripcion breve</label>
        <textarea id="f-notas" placeholder="Detalles, enlaces, requisitos..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
