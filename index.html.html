<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 Mis Tareas U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF6FA;
    --pink: #FF8FAB;
    --pink-deep: #E85D8F;
    --lavender: #C9B6E4;
    --blue: #A8D8F0;
    --mint: #8FE3C0;
    --coral: #FFB199;
    --ink: #5A4356;
    --ink-soft: #8A7688;
    --card: #FFFFFF;
    --shadow: rgba(232, 93, 143, 0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    font-family:'Nunito', sans-serif;
    color: var(--ink);
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3, .brand, .tab, .btn, .fab{ font-family:'Fredoka', sans-serif; }

  /* --- decoración flotante --- */
  .floaters{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .floaters span{
    position:absolute; font-size:22px; opacity:.35;
    animation: float 9s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-26px) rotate(12deg); }
  }

  .wrap{ max-width:820px; margin:0 auto; padding: 28px 18px 100px; position:relative; z-index:1; }

  header{ text-align:center; margin-bottom: 22px; }
  .brand{ font-size: 30px; font-weight:600; color: var(--pink-deep); margin:0 0 4px; }
  .subtitle{ color: var(--ink-soft); font-size:14px; margin:0 0 18px; }

  .tabs{
    display:inline-flex; background:#fff; padding:5px; border-radius:999px;
    box-shadow: 0 6px 16px var(--shadow);
  }
  .tab{
    border:none; background:transparent; padding:9px 20px; border-radius:999px;
    font-size:14px; font-weight:600; color: var(--ink-soft); cursor:pointer;
    transition: all .25s ease;
  }
  .tab.active{ background: var(--pink); color:#fff; box-shadow:0 4px 10px rgba(255,143,171,.5); }

  .view{ display:none; animation: pop .35s ease; }
  .view.active{ display:block; }
  @keyframes pop{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:translateY(0);} }

  h2.section-title{ font-size:16px; color: var(--pink-deep); margin: 22px 0 10px; font-weight:600; }
  .count-pill{
    display:inline-block; background: var(--lavender); color:#fff; font-size:11px;
    padding:2px 9px; border-radius:999px; margin-left:6px; vertical-align:middle;
  }

  .empty{
    text-align:center; color: var(--ink-soft); background:#fff; border-radius:20px;
    padding: 30px 16px; font-size:14px; box-shadow: 0 6px 16px var(--shadow);
  }

  .task-card{
    background:#fff; border-radius:18px; padding:14px 16px; margin-bottom:10px;
    box-shadow: 0 6px 16px var(--shadow); display:flex; align-items:center; gap:12px;
    animation: pop .3s ease; transition: transform .2s ease;
  }
  .task-card:hover{ transform: translateY(-2px); }
  .task-card.done{ opacity:.6; }
  .task-card.done .task-title{ text-decoration: line-through; }

  .check-btn{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:2px solid var(--pink);
    background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:transparent; transition: all .2s ease;
  }
  .check-btn.checked{ background: var(--mint); border-color: var(--mint); color:#fff; }

  .task-body{ flex:1; min-width:0; }
  .task-title{ font-weight:700; font-size:15px; margin:0 0 4px; word-break:break-word; }
  .task-meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color: var(--ink-soft); }
  .badge{ padding:2px 9px; border-radius:999px; font-weight:700; color:#fff; font-size:11px; }
  .badge.aula{ background: var(--lavender); }
  .badge.teams{ background: var(--blue); }
  .badge.examen{ background: var(--coral); }
  .badge.exposicion{ background: var(--mint); }
  .due{ font-weight:700; }
  .due.urgent{ color: var(--pink-deep); }

  .task-actions{ display:flex; gap:6px; flex:0 0 auto; }
  .icon-btn{
    border:none; background: var(--bg); width:30px; height:30px; border-radius:10px;
    cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease;
  }
  .icon-btn:hover{ transform: scale(1.12); }

  /* --- FAB --- */
  .fab{
    position:fixed; right:22px; bottom:22px; width:58px; height:58px; border-radius:50%;
    background: var(--pink); color:#fff; border:none; font-size:26px; cursor:pointer;
    box-shadow: 0 8px 20px rgba(255,143,171,.55); z-index:5;
    transition: transform .2s ease;
  }
  .fab:hover{ transform: scale(1.08) rotate(8deg); }

  /* --- modal --- */
  .overlay{
    position:fixed; inset:0; background: rgba(90,67,86,.35); display:none;
    align-items:center; justify-content:center; z-index:10; padding:16px;
  }
  .overlay.active{ display:flex; }
  .modal{
    background:#fff; border-radius:24px; padding:24px; width:100%; max-width:380px;
    box-shadow: 0 20px 40px rgba(90,67,86,.25); animation: pop .25s ease;
  }
  .modal h3{ margin:0 0 14px; color: var(--pink-deep); font-size:18px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:700; color: var(--ink-soft); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 12px; border-radius:12px; border:2px solid #F2D9E4;
    font-family:'Nunito', sans-serif; font-size:14px; color: var(--ink); background: var(--bg);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color: var(--pink); }
  .field textarea{ resize:vertical; min-height:50px; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; border:none; border-radius:14px; padding:11px; font-size:14px; font-weight:600;
    cursor:pointer; transition: transform .15s ease;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn.primary{ background: var(--pink); color:#fff; }
  .btn.ghost{ background: var(--bg); color: var(--ink-soft); }

  /* --- calendario --- */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-head button{ border:none; background:#fff; width:34px; height:34px; border-radius:10px; font-size:15px; cursor:pointer; box-shadow:0 4px 10px var(--shadow); }
  .cal-head .month-label{ font-weight:700; color: var(--pink-deep); font-size:16px; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
  .cal-dow{ text-align:center; font-size:11px; color: var(--ink-soft); font-weight:700; }
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:12px;
    font-size:13px; background:#fff; color: var(--ink); cursor:default; position:relative;
    box-shadow: 0 2px 6px rgba(90,67,86,.06);
  }
  .cal-day.pad{ background:transparent; box-shadow:none; }
  .cal-day.today{ border:2px solid var(--lavender); }
  .cal-day.deadline{ background: var(--pink); color:#fff; font-weight:700; cursor:pointer; }
  .cal-day.deadline.done-only{ background: var(--mint); }
  .cal-day .dot{ position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:#fff; }

  .cal-selected{ margin-top:18px; }
  .cal-selected h3{ font-size:14px; color: var(--pink-deep); margin:0 0 8px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--pink); border-radius:999px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="floaters" id="floaters"></div>

<div class="wrap">
  <header>
    <h1 class="brand">🎀 Mis Tareas U</h1>
    <p class="subtitle">Aula Virtual, Teams o clase — todo en un solo lugar</p>
    <div class="tabs">
      <button class="tab active" data-view="tareas">📋 Tareas</button>
      <button class="tab" data-view="calendario">🗓️ Calendario</button>
    </div>
  </header>

  <section class="view active" id="view-tareas">
    <h2 class="section-title">Pendientes <span class="count-pill" id="count-pend">0</span></h2>
    <div id="list-pendientes"></div>

    <h2 class="section-title">Completadas <span class="count-pill" id="count-done">0</span></h2>
    <div id="list-completadas"></div>
  </section>

  <section class="view" id="view-calendario">
    <div class="cal-head">
      <button id="cal-prev">◀</button>
      <span class="month-label" id="cal-label"></span>
      <button id="cal-next">▶</button>
    </div>
    <div class="cal-grid" id="cal-dow"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:6px;"></div>
    <div class="cal-selected" id="cal-selected"></div>
  </section>
</div>

<button class="fab" id="fab-add">+</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">Nueva tarea</h3>
    <form id="task-form">
      <input type="hidden" id="task-id">
      <div class="field">
        <label>Título</label>
        <input type="text" id="f-titulo" required placeholder="Ej: Taller de expresiones regulares">
      </div>
      <div class="field">
        <label>Dónde entregar</label>
        <select id="f-plataforma">
          <option value="aula">Aula Virtual</option>
          <option value="teams">Teams</option>
          <option value="examen">En clase — Examen</option>
          <option value="exposicion">En clase — Exposición</option>
        </select>
      </div>
      <div class="field">
        <label>Fecha límite</label>
        <input type="date" id="f-fecha" required>
      </div>
      <div class="field">
        <label>Notas (opcional)</label>
        <textarea id="f-notas" placeholder="Detalles, enlaces, requisitos..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'kawaiiTasksU';
  const PLAT_LABEL = { aula:'Aula Virtual', teams:'Teams', examen:'Examen presencial', exposicion:'Exposición' };

  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let calDate = new Date();
  let selectedDay = null;

  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function daysUntil(fecha){
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(fecha+'T00:00:00');
    return Math.round((d - today) / 86400000);
  }
  function dueLabel(fecha){
    const n = daysUntil(fecha);
    if(n < 0) return 'Venció';
    if(n === 0) return 'Hoy';
    if(n === 1) return 'Mañana';
    return `En ${n} días`;
  }

  /* ---------- render tareas ---------- */
  function renderTasks(){
    const pend = tasks.filter(t=>!t.completada).sort((a,b)=> a.fecha.localeCompare(b.fecha));
    const done = tasks.filter(t=>t.completada).sort((a,b)=> b.fecha.localeCompare(a.fecha));

    document.getElementById('count-pend').textContent = pend.length;
    document.getElementById('count-done').textContent = done.length;

    const pendEl = document.getElementById('list-pendientes');
    const doneEl = document.getElementById('list-completadas');

    pendEl.innerHTML = pend.length ? pend.map(cardHTML).join('') :
      '<div class="empty">✨ No tienes tareas pendientes. ¡A descansar!</div>';
    doneEl.innerHTML = done.length ? done.map(cardHTML).join('') :
      '<div class="empty">Aún no marcas tareas como completadas.</div>';

    document.querySelectorAll('[data-check]').forEach(b=> b.onclick = ()=> toggleDone(b.dataset.check));
    document.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> openEdit(b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> removeTask(b.dataset.del));
  }

  function cardHTML(t){
    const n = daysUntil(t.fecha);
    const urgent = !t.completada && n <= 1;
    return `
    <div class="task-card ${t.completada?'done':''}">
      <button class="check-btn ${t.completada?'checked':''}" data-check="${t.id}">${t.completada?'✓':''}</button>
      <div class="task-body">
        <p class="task-title">${escapeHTML(t.titulo)}</p>
        <div class="task-meta">
          <span class="badge ${t.plataforma}">${PLAT_LABEL[t.plataforma]}</span>
          <span class="due ${urgent?'urgent':''}">${dueLabel(t.fecha)} · ${formatDate(t.fecha)}</span>
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn" data-edit="${t.id}">✏️</button>
        <button class="icon-btn" data-del="${t.id}">🗑️</button>
      </div>
    </div>`;
  }

  function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function formatDate(f){
    const d = new Date(f+'T00:00:00');
    return d.toLocaleDateString('es-CO', { day:'numeric', month:'short' });
  }

  function toggleDone(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    t.completada = !t.completada;
    save(); renderTasks(); renderCalendar();
    if(t.completada) confetti();
  }
  function removeTask(id){
    if(!confirm('¿Eliminar esta tarea?')) return;
    tasks = tasks.filter(x=>x.id!==id);
    save(); renderTasks(); renderCalendar();
  }

  /* ---------- modal ---------- */
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('task-form');
  document.getElementById('fab-add').onclick = ()=> openNew();
  document.getElementById('btn-cancel').onclick = closeModal;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };

  function openNew(){
    document.getElementById('modal-title').textContent = 'Nueva tarea';
    form.reset();
    document.getElementById('task-id').value = '';
    overlay.classList.add('active');
  }
  function openEdit(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    document.getElementById('modal-title').textContent = 'Editar tarea';
    document.getElementById('task-id').value = t.id;
    document.getElementById('f-titulo').value = t.titulo;
    document.getElementById('f-plataforma').value = t.plataforma;
    document.getElementById('f-fecha').value = t.fecha;
    document.getElementById('f-notas').value = t.notas || '';
    overlay.classList.add('active');
  }
  function closeModal(){ overlay.classList.remove('active'); }

  form.onsubmit = (e)=>{
    e.preventDefault();
    const id = document.getElementById('task-id').value;
    const data = {
      titulo: document.getElementById('f-titulo').value.trim(),
      plataforma: document.getElementById('f-plataforma').value,
      fecha: document.getElementById('f-fecha').value,
      notas: document.getElementById('f-notas').value.trim(),
    };
    if(!data.titulo || !data.fecha) return;
    if(id){
      const t = tasks.find(x=>x.id===id);
      Object.assign(t, data);
    } else {
      tasks.push({ id: uid(), completada:false, ...data });
    }
    save(); closeModal(); renderTasks(); renderCalendar();
  };

  /* ---------- tabs ---------- */
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('view-'+tab.dataset.view).classList.add('active');
      if(tab.dataset.view==='calendario') renderCalendar();
    };
  });

  /* ---------- calendario ---------- */
  const DOWS = ['D','L','M','M','J','V','S'];
  function renderCalendar(){
    const dowEl = document.getElementById('cal-dow');
    if(!dowEl.childElementCount){
      dowEl.innerHTML = DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    }
    const y = calDate.getFullYear(), m = calDate.getMonth();
    document.getElementById('cal-label').textContent =
      calDate.toLocaleDateString('es-CO', { month:'long', year:'numeric' });

    const first = new Date(y,m,1);
    const startPad = first.getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();
    const todayStr = new Date().toISOString().slice(0,10);

    let html = '';
    for(let i=0;i<startPad;i++) html += '<div class="cal-day pad"></div>';
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayTasks = tasks.filter(t=>t.fecha===dateStr);
      const pendCount = dayTasks.filter(t=>!t.completada).length;
      let cls = 'cal-day';
      if(dateStr===todayStr) cls += ' today';
      if(pendCount>0) cls += ' deadline';
      else if(dayTasks.length>0) cls += ' deadline done-only';
      html += `<div class="${cls}" data-date="${dateStr}">${d}${dayTasks.length?'<span class="dot"></span>':''}</div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;

    document.querySelectorAll('.cal-day[data-date]').forEach(cell=>{
      cell.onclick = ()=>{ selectedDay = cell.dataset.date; renderSelectedDay(); };
    });
    if(selectedDay) renderSelectedDay();
  }

  function renderSelectedDay(){
    const box = document.getElementById('cal-selected');
    const dayTasks = tasks.filter(t=>t.fecha===selectedDay);
    if(!dayTasks.length){ box.innerHTML=''; return; }
    box.innerHTML = `<h3>Tareas para ${formatDate(selectedDay)}</h3>` + dayTasks.map(cardHTML).join('');
    document.querySelectorAll('[data-check]').forEach(b=> b.onclick = ()=> toggleDone(b.dataset.check));
    document.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> openEdit(b.dataset.edit));
    document.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> removeTask(b.dataset.del));
  }

  document.getElementById('cal-prev').onclick = ()=>{ calDate.setMonth(calDate.getMonth()-1); renderCalendar(); };
  document.getElementById('cal-next').onclick = ()=>{ calDate.setMonth(calDate.getMonth()+1); renderCalendar(); };

  /* ---------- confetti al completar ---------- */
  function confetti(){
    const emojis = ['🎉','✨','💗','🌸'];
    for(let i=0;i<14;i++){
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.position = 'fixed';
      s.style.left = (45 + Math.random()*10) + 'vw';
      s.style.top = '40vh';
      s.style.fontSize = (14 + Math.random()*10) + 'px';
      s.style.zIndex = 20;
      s.style.pointerEvents = 'none';
      s.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
      document.body.appendChild(s);
      const angle = Math.random()*Math.PI*2, dist = 80+Math.random()*120;
      requestAnimationFrame(()=>{
        s.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist - 60}px) rotate(${Math.random()*360}deg)`;
        s.style.opacity = '0';
      });
      setTimeout(()=> s.remove(), 1000);
    }
  }

  /* ---------- floaters de fondo ---------- */
  (function initFloaters(){
    const box = document.getElementById('floaters');
    const items = ['🌸','⭐','💗','🎀','✨'];
    for(let i=0;i<9;i++){
      const s = document.createElement('span');
      s.textContent = items[i % items.length];
      s.style.left = (Math.random()*95)+'vw';
      s.style.top = (Math.random()*95)+'vh';
      s.style.animationDelay = (Math.random()*6)+'s';
      s.style.animationDuration = (7+Math.random()*5)+'s';
      box.appendChild(s);
    }
  })();

  renderTasks();
  renderCalendar();
})();
</script>
</body>
</html>
